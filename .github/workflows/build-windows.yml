name: Build Windows EXE & Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号 (例如 1.1.0)"
        required: false
        default: "1.1.0"
      publish_release:
        description: "构建完成后自动发布到 GitHub Releases"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Windows EXE, Portable ZIP & Inno Setup Installer
        id: build_step
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if ((-not (Test-Path "requirements.txt")) -and (Test-Path "moonlight-whisper/requirements.txt")) {
              Write-Host "检测到项目位于子目录 moonlight-whisper/，自动切换工作目录..."
              Set-Location "moonlight-whisper"
          }

          # 解析版本号：若由 tag (如 v1.1.0) 触发则提取 tag 版本，否则使用输入参数或默认 1.1.0
          $InputVer = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($InputVer)) {
              $InputVer = "1.1.0"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME.StartsWith("v")) {
              $AppVersion = $env:GITHUB_REF_NAME.Substring(1)
              $ReleaseTag = $env:GITHUB_REF_NAME
          } else {
              $AppVersion = $InputVer.TrimStart("v")
              $ReleaseTag = "v$AppVersion"
          }
          $env:APP_VERSION = $AppVersion
          "app_version=$AppVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$ReleaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "当前构建版本: $AppVersion (Release Tag: $ReleaseTag)" -ForegroundColor Cyan

          Write-Host "=== 1. 检查 Python 环境并安装依赖 ==="
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "依赖安装失败" }

          Write-Host "=== 2. 下载 FFmpeg essentials 到 bin/ffmpeg.exe ==="
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          if (-not (Test-Path "bin/ffmpeg.exe")) {
              curl.exe -L --retry 3 "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -o ffmpeg.zip
              Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
              $ffmpegExe = Get-ChildItem -Path ffmpeg_tmp -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
              if ($null -eq $ffmpegExe) { throw "未在压缩包中找到 ffmpeg.exe" }
              Copy-Item $ffmpegExe.FullName -Destination "bin/ffmpeg.exe" -Force
              Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_tmp
          }

          Write-Host "=== 3. 运行单元测试 ==="
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "单元测试未通过" }

          Write-Host "=== 4. 执行 PyInstaller 打包 ==="
          if (Test-Path "dist/MoonlightWhisper") {
              Remove-Item -Recurse -Force "dist/MoonlightWhisper"
          }
          python -m PyInstaller --noconfirm --clean "build/app.spec"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 打包失败" }

          New-Item -ItemType Directory -Force -Path "dist/MoonlightWhisper/bin" | Out-Null
          Copy-Item -Path "bin/*" -Destination "dist/MoonlightWhisper/bin/" -Recurse -Force

          New-Item -ItemType Directory -Force -Path "dist/installer" | Out-Null
          $PortableZip = "dist/installer/MoonlightWhisper-Portable-$AppVersion-win64.zip"
          Compress-Archive -Path "dist/MoonlightWhisper/*" -DestinationPath $PortableZip -Force

          Write-Host "=== 5. 调用 Inno Setup 生成 Setup.exe 安装包 ==="
          $IsccExe = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $IsccExe)) {
              $IsccExe = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $IsccExe) {
              & $IsccExe "/DMyAppVersion=$AppVersion" "build/installer.iss"
              if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }
          }

          $OutRoot = Join-Path $env:GITHUB_WORKSPACE "release_out"
          New-Item -ItemType Directory -Force -Path $OutRoot | Out-Null
          Copy-Item -Path "dist/installer/*" -Destination $OutRoot -Force

          # 生成 SHA256SUMS.txt 校验文件
          $ShaLines = @()
          foreach ($file in Get-ChildItem -Path $OutRoot -File) {
              $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
              $ShaLines += "$hash  $($file.Name)"
          }
          $ShaLines | Set-Content -Path (Join-Path $OutRoot "SHA256SUMS.txt") -Encoding UTF8
          Get-ChildItem $OutRoot

      - name: Upload Windows EXE & Portable ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoonlightWhisper-v${{ steps.build_step.outputs.app_version }}-Windows-x64
          path: release_out/*
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $Tag = "${{ steps.build_step.outputs.release_tag }}"
          $Ver = "${{ steps.build_step.outputs.app_version }}"
          $OutRoot = Join-Path $env:GITHUB_WORKSPACE "release_out"

          $Notes = @"
          ## Moonlight Whisper v$Ver (Windows 10/11 x64)

          ### 下载说明
          - **`MoonlightWhisper-Setup-$Ver.exe`**：Windows 标准向导安装包（支持自定义安装路径、创建桌面快捷方式与卸载管理，推荐）。
          - **`MoonlightWhisper-Portable-$Ver-win64.zip`**：免安装绿色便携版（解压后双击 `MoonlightWhisper.exe` 即可运行）。
          - **`SHA256SUMS.txt`**：安装包与便携版压缩包的 SHA-256 校验值清单。
          "@

          $NotesFile = Join-Path $env:RUNNER_TEMP "release_notes.md"
          $Notes | Set-Content -Path $NotesFile -Encoding UTF8

          gh release view $Tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $Tag 已存在，正在覆盖更新最新安装包资产..." -ForegroundColor Yellow
              gh release upload $Tag "$OutRoot/*" --clobber
              gh release edit $Tag --title "Moonlight Whisper $Tag" --notes-file $NotesFile
          } else {
              Write-Host "正在创建新的 GitHub Release: $Tag ..." -ForegroundColor Green
              gh release create $Tag "$OutRoot/*" --title "Moonlight Whisper $Tag" --notes-file $NotesFile --target $env:GITHUB_SHA
          }
