name: Build Windows EXE & Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  APP_VERSION: "1.0.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Windows EXE, Portable ZIP & Inno Setup Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if ((-not (Test-Path "requirements.txt")) -and (Test-Path "moonlight-whisper/requirements.txt")) {
              Write-Host "检测到项目位于子目录 moonlight-whisper/，自动切换工作目录..."
              Set-Location "moonlight-whisper"
          }

          Write-Host "=== 1. 检查 Python 环境并安装依赖 ==="
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "依赖安装失败" }

          Write-Host "=== 2. 下载 FFmpeg essentials 到 bin/ffmpeg.exe ==="
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          if (-not (Test-Path "bin/ffmpeg.exe")) {
              curl.exe -L --retry 3 "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -o ffmpeg.zip
              Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
              $ffmpegExe = Get-ChildItem -Path ffmpeg_tmp -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
              if ($null -eq $ffmpegExe) { throw "未在压缩包中找到 ffmpeg.exe" }
              Copy-Item $ffmpegExe.FullName -Destination "bin/ffmpeg.exe" -Force
              Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_tmp
          }

          Write-Host "=== 3. 运行单元测试 ==="
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "单元测试未通过" }

          Write-Host "=== 4. 执行 PyInstaller 打包 ==="
          if (Test-Path "dist/MoonlightWhisper") {
              Remove-Item -Recurse -Force "dist/MoonlightWhisper"
          }
          python -m PyInstaller --noconfirm --clean "build/app.spec"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 打包失败" }

          New-Item -ItemType Directory -Force -Path "dist/MoonlightWhisper/bin" | Out-Null
          Copy-Item -Path "bin/*" -Destination "dist/MoonlightWhisper/bin/" -Recurse -Force

          New-Item -ItemType Directory -Force -Path "dist/installer" | Out-Null
          $PortableZip = "dist/installer/MoonlightWhisper-Portable-$env:APP_VERSION.zip"
          Compress-Archive -Path "dist/MoonlightWhisper/*" -DestinationPath $PortableZip -Force

          Write-Host "=== 5. 调用 Inno Setup 生成 Setup.exe 安装包 ==="
          $IsccExe = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $IsccExe)) {
              $IsccExe = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $IsccExe) {
              & $IsccExe "/DMyAppVersion=$env:APP_VERSION" "build/installer.iss"
              if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }
          }

          $OutRoot = Join-Path $env:GITHUB_WORKSPACE "release_out"
          New-Item -ItemType Directory -Force -Path $OutRoot | Out-Null
          Copy-Item -Path "dist/installer/*" -Destination $OutRoot -Force
          Get-ChildItem $OutRoot

      - name: Upload Windows EXE & Portable ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoonlightWhisper-Windows-x64
          path: release_out/*
          if-no-files-found: error
